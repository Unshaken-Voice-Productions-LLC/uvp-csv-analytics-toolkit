[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-analytics-pipeline"
version = "0.1.0"
description = "Production-style CSV analytics pipeline with validation, cleaning, analysis, and insight generation."
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

